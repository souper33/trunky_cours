<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réviser le japonais</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Réviser le japonais</h1>
<p>Cours 1 à 4 et cours en autonomie : fiches, flashcards et quiz</p>
</header>
<nav id="tabs" role="tablist"></nav>
<main>
<section id="fiches"><p class="mut">Touche une fiche pour l’ouvrir. Elles sont détaillées : lis-les dans l’ordre, puis passe aux flashcards.</p><div id="flist"></div></section>
<section id="cards" hidden>
<div class="filters" id="cf"></div>
<p class="mut" id="cinfo"></p>
<button class="fc" id="card" aria-live="polite"></button>
<div class="row"><button class="btn" id="prev">Précédente</button><button class="btn" id="mix">Mélanger</button><button class="btn main" id="next">Suivante</button></div>
<p class="mut">Touche la carte pour voir la réponse.</p>
</section>
<section id="quiz" hidden>
<div class="filters" id="qf"></div>
<p class="mut" id="qinfo"></p>
<div id="qbox"></div>
</section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
